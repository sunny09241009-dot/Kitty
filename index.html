<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小黑貓 Kitty</title><meta name="description" content="一隻等你摸摸的小黑貓。"><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#f7f3ea;color:#292824;font-family:ui-rounded,'PingFang TC',sans-serif;display:grid;place-items:center;text-align:center}main{width:min(100%,520px);padding:36px 24px}.label{font-size:11px;letter-spacing:4px;color:#8a887d}h1{font-size:32px;font-weight:500;margin:28px 0 4px}p{color:#878579;font-size:14px;line-height:1.8}.cat{border:0;background:none;width:100%;max-width:350px;cursor:pointer;padding:10px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.cat svg{width:100%;overflow:visible}.tail{transform-origin:230px 248px;animation:wag 3s ease-in-out infinite}.eyes{transform-origin:0 148px;animation:blink 6s infinite}.heart{opacity:0;fill:#d98487}.happy .heart{animation:love 1s ease-out}.happy .catbody{animation:bounce .5s ease}.cat:focus-visible{outline:2px dashed #9c967e;border-radius:30px}.foot{font-size:11px;letter-spacing:2px;margin-top:40px}@keyframes wag{50%{transform:rotate(-10deg)}}@keyframes blink{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(.08)}}@keyframes love{20%{opacity:1}100%{opacity:0;transform:translateY(-35px)}}@keyframes bounce{50%{transform:translateY(-9px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></head><body><main><div class="label">A LITTLE HELLO FROM KITTY</div><h1>嗨，我是小黑貓</h1><p id="message" aria-live="polite">等你好久了，摸摸我的頭吧。</p><button class="cat" aria-label="摸摸小黑貓"><svg viewBox="0 0 340 330" role="img" aria-label="一隻有黃綠色眼睛、圓滾滾的可愛黑貓"><ellipse cx="170" cy="294" rx="109" ry="13" fill="#e8e2d5"/><path class="tail" d="M220 262 Q305 280 289 204 Q278 181 268 198" fill="none" stroke="#29292e" stroke-width="24" stroke-linecap="round"/><g class="catbody"><path d="M109 196 Q84 237 98 282 Q130 303 170 289 Q207 304 236 281 Q249 235 218 195" fill="#29292e"/><ellipse cx="170" cy="245" rx="35" ry="40" fill="#323238"/><path d="M85 142 L86 63 Q88 52 98 62 L137 95 Q170 85 203 96 L244 61 Q255 54 254 69 L255 146 Q267 205 174 217 Q76 213 85 142Z" fill="#25252b"/><path d="M98 81 L101 119 L125 101Z M241 80 L216 103 L241 119Z" fill="#b28c92"/><g class="eyes" fill="#d5df98"><ellipse cx="132" cy="150" rx="19" ry="22"/><ellipse cx="207" cy="150" rx="19" ry="22"/><g fill="#22232a"><ellipse cx="136" cy="151" rx="7" ry="17"/><ellipse cx="203" cy="151" rx="7" ry="17"/></g><g fill="white"><circle cx="130" cy="143" r="4"/><circle cx="198" cy="143" r="4"/></g></g><path d="M164 176 Q170 171 177 176 L170 182Z" fill="#c6979f"/><path d="M170 182 Q162 193 156 184 M170 182 Q178 193 184 184" fill="none" stroke="#b5a6a8" stroke-width="2.5" stroke-linecap="round"/><path d="M115 181 L69 173 M115 189 L68 192 M224 181 L268 173 M224 189 L270 193" stroke="#77717a" stroke-width="2" stroke-linecap="round"/><ellipse cx="125" cy="281" rx="27" ry="14" fill="#25252b"/><ellipse cx="210" cy="281" rx="27" ry="14"/></g><path class="heart" d="M166 55 C136 35 152 18 167 34 C183 17 198 36 166 55"/></svg></button><p>小小的網頁，裝著一隻喜歡你的貓。</p><div class="foot">KITTY · JUST FOR YOU</div></main><script>const cat=document.querySelector('.cat'),message=document.querySelector('#message');let count=0,timer;cat.addEventListener('click',()=>{message.textContent=['喵～ 再摸一下嘛。','呼嚕呼嚕⋯⋯好舒服。','今天也要開開心心喔。'][count++%3];cat.classList.remove('happy');void cat.offsetWidth;cat.classList.add('happy');clearTimeout(timer);timer=setTimeout(()=>cat.classList.remove('happy'),1100)});</script></body></html>
